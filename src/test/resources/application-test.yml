spring:
  datasource:
    url: jdbc:h2:mem:schedule;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false

ai:
  usage-report:
    enabled: false

schedule:
  gateway-auth:
    enabled: false
