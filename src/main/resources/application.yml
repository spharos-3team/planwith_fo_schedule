spring:
  application:
    name: planwith-fo-schedule
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        "[spring.json.add.type.headers]": false

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:0}

eureka:
  client:
    service-url:
      defaultZone: "${EUREKA_DEFAULT_ZONE:http://discovery:8761/eureka/}"
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  deploy:
    marker: ${DEPLOY_MARKER:planwith-fo-schedule-deploy-v1}
  openapi:
    server-url: ${SWAGGER_SERVER_URL:/}

schedule:
  gateway-auth:
    enabled: ${SCHEDULE_GATEWAY_AUTH_ENABLED:true}

ai:
  token-policy:
    openai-tokens-per-product-token: ${AI_OPENAI_TOKENS_PER_PRODUCT_TOKEN:1000}
  usage-report:
    enabled: ${AI_USAGE_REPORT_ENABLED:false}
    topic: ${AI_USAGE_REPORT_TOPIC:planwith.ai-usage.reported}
    relay-batch-size: ${AI_USAGE_REPORT_RELAY_BATCH_SIZE:50}
    relay-interval: ${AI_USAGE_REPORT_RELAY_INTERVAL:5s}
    relay-initial-delay: ${AI_USAGE_REPORT_RELAY_INITIAL_DELAY:5s}
    send-timeout: ${AI_USAGE_REPORT_SEND_TIMEOUT:10s}
    initial-retry-delay: ${AI_USAGE_REPORT_INITIAL_RETRY_DELAY:5s}
    max-retry-delay: ${AI_USAGE_REPORT_MAX_RETRY_DELAY:5m}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  image-search-model: ${OPENAI_IMAGE_SEARCH_MODEL:gpt-5.6}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com}
  connect-timeout-millis: ${OPENAI_CONNECT_TIMEOUT_MILLIS:5000}
  read-timeout-millis: ${OPENAI_READ_TIMEOUT_MILLIS:60000}

aviationstack:
  enabled: ${AVIATIONSTACK_ENABLED:false}
  access-key: ${AVIATIONSTACK_ACCESS_KEY:}
  base-url: ${AVIATIONSTACK_BASE_URL:https://api.aviationstack.com/v1}
  connect-timeout-millis: ${AVIATIONSTACK_CONNECT_TIMEOUT_MILLIS:5000}
  read-timeout-millis: ${AVIATIONSTACK_READ_TIMEOUT_MILLIS:10000}

flight:
  recommendation:
    cache:
      enabled: ${FLIGHT_RECOMMENDATION_CACHE_ENABLED:true}
      ttl: ${FLIGHT_RECOMMENDATION_CACHE_TTL:10m}
      key-prefix: ${FLIGHT_RECOMMENDATION_CACHE_KEY_PREFIX:flight:recommendation}
