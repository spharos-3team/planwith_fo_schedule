spring:
  application:
    name: planwith-fo-schedule

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8081}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}

app:
  auth:
    id: ${LOGIN_ID:}
    pw: ${LOGIN_PASSWORD:}
  deploy:
    marker: ${DEPLOY_MARKER:planwith-fo-schedule-deploy-v1}
